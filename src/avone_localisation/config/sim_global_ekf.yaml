ekf_filter_node_map:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: true
    debug: false
   
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map              # ← MUST be map for global EKF
    publish_tf: true
    
    odom1: /odometry/gps_new
    odom1_config: [true,  true,  false,    # X, Y position
                   false, false, false,
                   false, false, false,     # Don't fuse velocity here
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false      # ← Must be false for absolute GPS
    odom1_relative: false
    
    imu0: /imu_gps
    imu0_config: [false, false, false,
                  false, false, false,     # ← Remove yaw orientation
                  false, false, false,
                  false, false, true,      # Only yaw rate
                  true,  true,  false]     # Add accelerations
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
    
    twist0: /vel_cov
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,   # X, Y velocities
                    false, false, false,
                    false, false, false]
    twist0_queue_size: 10
    twist0_differential: false
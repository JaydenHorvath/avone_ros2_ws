# avone_ekf.config (robot_localization EKF parameters for AV.ONE odom fusion)
# ----------------------------------------------------------------------------
# This config runs an EKF instance (ekf_filter_node_odom) to produce a smooth, 2D odometry estimate in the `odom` frame.
# It fuses:
#   1) Wheel/controller odometry (Ackermann controller) for short-term motion (vx, vy)
#   2) IMU gyro (yaw rate) for heading dynamics
#   3) GPS-derived local odometry for long-term position correction (x, y)
#   4) GPS heading as an IMU orientation measurement (yaw only) via /imu_gps
#
# Design intent:
#   - Keep the filter in two_d_mode for track driving (flat plane).
#   - Trust wheel odom/IMU for fast dynamics.
#   - Use GPS odom to stop drift in x/y.
#   - Use GPS heading to stabilize absolute yaw (if available and well-calibrated).
#
# Common gotchas:
#   - Ensure frames match your TF tree: odom_frame, base_link_frame, world_frame.
#   - /imu/data should be in base_link frame or correctly TF’d into it (robot_localization expects that).
#   - /imu_gps must have realistic yaw covariance, otherwise EKF will over-trust it and yaw will jump/noise.
#   - /odometry/gps1 must be in the same world_frame (odom) and represent local x/y (not lat/lon).



ekf_filter_node_odom:
  ros__parameters:

    # If running in Gazebo or bag playback with /clock, keep this true.
    use_sim_time: true

    # EKF update rate (Hz). Match this to your fastest sensor(s) if possible.
    frequency: 50.0

    # Constrain the filter to planar motion (Z, roll, pitch are ignored/held).
    two_d_mode: true




    # ------------------------------------------------------------------------
    # Input 0: Wheel/controller odometry
    # ------------------------------------------------------------------------
    # Fusing: 
    #  - vx, vy (linear velocities in base_link)
  

    odom0: /ackermann_steering_controller/odometry
    odom0_config: [
      false, false, false,    # X, Y, Z positions
      false, false, false,    #  roll, pitch, yaw orientations
      true,  true,  false,    #  X, Y, Z linear velocities
      false, false, false,     #  roll, pitch, yaw angular velocities
      false, false, false     #  X, Y, Z linear accelerations
    ]


    # ------------------------------------------------------------------------
    # Input 1: IMU gyro (yaw rate) from VN100
    # ------------------------------------------------------------------------

    # Fusing: 
    #  - vyaw (yaw rate)

    imu0: /imu/data 
    imu0_config: [
      false, false, false,    # X, Y, Z positions
      false, false, false,     #  roll, pitch, yaw orientations
      false, false, false,    #  X, Y, Z linear velocities
      false, false, true,     #  roll, pitch, yaw angular velocities
      false, false, false     #  X, Y, Z linear accelerations
    ]
    imu0_remove_gravitational_acceleration: true

    # ------------------------------------------------------------------------
    # Input 2: GPS-derived local odometry (position correction)
    # ------------------------------------------------------------------------
    
    # Fusing: 
    #  - x and y positions

    odom1: /odometry/gps1
    odom1_config: [true,  true,  false,    # x y z (pose)
                   false, false, false,    # roll pitch yaw (pose)
                   false, false, false,    # vx vy vz (twist)
                   false, false, false,    # vroll vpitch vyaw (twist)
                   false, false, false]    # ax ay az (accel)
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false


    # ------------------------------------------------------------------------
    # Input 3: GPS heading as an IMU orientation source (yaw only)
    # ----------------------------------------------------------------------

    # Fusing: 
    #   - yaw orientation

    imu1: /imu_gps
    imu1_config: [
      false, false, false,    # X, Y, Z positions
      false, false, true,     #  roll, pitch, yaw orientations
      false, false, false,    #  X, Y, Z linear velocities
      false, false, false,     #  roll, pitch, yaw angular velocities
      false, false, false     #  X, Y, Z linear accelerations
    ]
    imu1_remove_gravitational_acceleration: true



    # odom_frame: the parent frame of your published state estimate
    odom_frame: odom

    # base_link_frame: the vehicle body frame for the estimate
    base_link_frame: base_link

    # world_frame: usually same as odom_frame for a pure local EKF (no map fusion here)
    world_frame: odom

    # Publish TF transform odom -> base_link from this EKF
    publish_tf: true

    # Publish the odometry frame as well (depends on your robot_localization version/settings)
    publish_odometry_frame: true

    # Allow some TF slop for delayed transforms or slightly lagged sensor timestamps
    transform_tolerance: 0.2

    # Helpful when using sim time or bag playback that jumps in time
    reset_on_time_jump: true

    # Smooth lagged data can help if sensor timestamps arrive a bit late
    smooth_lagged_data: true
ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    two_d_mode: true
    
    odom0: /odometry/sim
    odom0_config: [
      true, true, false,  # ← Don't fuse position (use velocity only)
      false, false, false,
      true,  true,  false,  # X, Y velocities
      false, false, false,   # yaw rate
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    
    imu0: /imu/sim
    imu0_config: [
      false, false, false,
      false, false, false,  # ← Remove yaw orientation
      false, false, false,
      false, false, true,   # yaw rate only
      true,  true,  false   # linear accelerations
    ]
    imu0_remove_gravitational_acceleration: true
    imu0_differential: false
    imu0_relative: false
    
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    publish_tf: true
    publish_odometry_frame: true
    transform_timeout: 0.2
    transform_time_offset: 0.0



ekf_filter_node_map:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: true
    debug: false

   
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    publish_tf:     true
    publish_odometry_frame: true

    odom0: /odometry/local1
    odom0_config: [
      false, false, false,    # X, Y, Z positions
      false, false, false,    #  roll, pitch, yaw orientations
      true,  true,  false,    #  X, Y, Z linear velocities
      false, false, true,     #  roll, pitch, yaw angular velocities
      false, false, false     #  X, Y, Z linear accelerations
              ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    odom1: /odometry/gps1
    odom1_config: [true,  true,  false,    # x y z (pose)
                   false, false, false,    # roll pitch yaw (pose)
                   false, false, false,    # vx vy vz (twist)
                   false, false, false,    # vroll vpitch vyaw (twist)
                   false, false, false]    # ax ay az (accel)
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false


        # IMU input for orientation
    imu1: /imu_gps
    imu1_config: [
      false, false, false,    # X, Y, Z positions
      false, false, true,     #  roll, pitch, yaw orientations
      false, false, false,    #  X, Y, Z linear velocities
      false, false, false,     #  roll, pitch, yaw angular velocities
      false, false, false     #  X, Y, Z linear accelerations
    ]
    imu1_remove_gravitational_acceleration: true

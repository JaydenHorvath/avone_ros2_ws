################################################################################
# 🧭 NAVIGATION CONFIGURATION — AV.ONE DRIVERLESS (SIMPLE BT VERSION)
#
# Simplified setup for direct ComputePathToPose → FollowPath behavior.
# Behavior Server (Spin/Backup/etc.) removed.
#
# GPS WPF Changes:
# - AMCL removed (global localization from EKF/GPS)
# - Static layers removed (no global map)
# - Global costmap uses rolling window (for large GPS-driven navigation)
################################################################################


##############################
# 🧠 Behavior Tree Navigator
##############################
bt_navigator:
  ros__parameters:
    use_sim_time: true                     # Use sim time (Gazebo or rosbag)
    default_nav_to_pose_bt_xml: $(find-pkg-share avone_nav)/behaviour_trees/avone_bt.xml
    global_frame: map                      # Frame of goals
    robot_base_frame: base_link            # Robot’s main reference frame
    odom_topic: /odometry/global           # Velocity source for BT
    bt_loop_duration: 10                   # Tick rate of behavior tree (Hz^-1)

    # Single navigator plugin (no NavThroughPoses)
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"


##############################
# ⚙️ Controller Server
#    - Regulated Pure Pursuit Controller
#    - Responsible for real-time velocity & path following
##############################
controller_server:
  ros__parameters:
    controller_frequency: 20.0             # Hz control loop
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3                 # Allowable deviation before abort
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: general_goal_checker    
    controller_plugins: ["FollowPath"]

    # --- Progress Checker ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2        # Must move this far to count as progress
      movement_time_allowance: 5.0         # Time window for progress (s)

    # --- Goal Checker ---
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.8               # Distance tolerance (m)
      yaw_goal_tolerance: 3.14             # Orientation tolerance (rad)
      latch_xy_goal_tolerance: True        # Latch goal success once inside XY tol

    # --- Main Path Follower ---
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      use_collision_detection: true        # Enable collision checking in controller

      # --- Velocity & Accel Limits ---
      acceleration_limit: 0.1              # m/s² (gentle take-off)
      deceleration_limit: 0.8              # m/s² (stronger braking)
      desired_linear_vel: 2.0              # target cruising speed (m/s)
      min_speed: 0.05
      max_speed: 2.0
      allow_reversing: False

      # --- Goal Approach Control ---
      use_approach_linear_velocity_scaling: true
      approach_velocity_scaling_dist: 5.0  # Start slowing down 5 m before goal
      min_approach_linear_velocity: 0.5    # Crawl speed at goal

      # --- Lookahead Control ---
      lookahead_dist: 3.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 5.0
      lookahead_time: 2.0

      # --- Velocity Regulation ---
      use_regulated_linear_velocity_scaling: False
      use_cost_regulated_linear_velocity_scaling: False
      regulated_linear_scaling_min_radius: 2.5
      regulated_linear_scaling_min_speed: 0.2

      # --- Costmap Influence ---
      inflation_cost_scaling_factor: 3.0

      # --- Heading Control ---
      rotate_to_heading_angular_vel: 0.1

      # --- Kinematic Limits ---
      max_vel_x: 0.5                       # Final forward velocity cap
      max_vel_theta: 0.5                   # Max rotational velocity
      max_angular_accel: 0.5               # Rotational acceleration (rad/s²)

      # --- Goal Tolerances ---
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14
      latch_xy_goal_tolerance: false


##############################
# 🗺 Local Costmap
#    - Short-range obstacle avoidance region
##############################
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[
        [-0.17, -0.944],
        [ 2.845, -0.944],
        [ 2.845,  0.944],
        [-0.17,  0.944]
      ]"                                   # Vehicle footprint (m)
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.05
      robot_radius: 1.0

      plugins: ["voxel_layer", "inflation_layer"]

      # --- 3D Voxel Obstacle Layer ---
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 16
        max_obstacle_height: 3.2
        mark_threshold: 1
        unknown_threshold: 2147483647
        combination_method: 1
        obstacle_max_range: 50.0
        raytrace_max_range: 50.0
        observation_sources: pointcloud
        pointcloud:
          topic: /lidar/points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 3.2
          obstacle_max_range: 50.0
          raytrace_max_range: 50.0

      # --- Inflation Layer ---
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 2.0
        cost_scaling_factor: 5.0


##############################
# 🌏 Global Costmap
#    - Long-range global planner reference
#    - Rolling to follow GPS-based motion
##############################
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[
        [-0.17, -0.744],
        [ 2.445, -0.744],
        [ 2.445,  0.744],
        [-0.17,  0.744]
      ]"
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 1.0
      resolution: 0.1
      rolling_window: true                 # Rolling costmap for large-scale GPS nav
      width: 150
      height: 150
      track_unknown_space: true

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 16
        max_obstacle_height: 3.2
        mark_threshold: 1
        unknown_threshold: 2147483647
        combination_method: 1
        obstacle_max_range: 50.0
        raytrace_max_range: 50.0
        observation_sources: pointcloud
        pointcloud:
          topic: /lidar/points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 3.2
          obstacle_max_range: 50.0
          raytrace_max_range: 50.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 2.0
        cost_scaling_factor: 5.0


##############################
# 🧮 Planner Server
#    - Smac Hybrid Planner (Dubins)
#    - Generates Ackermann-feasible global paths
##############################
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 3.0
      downsample_costmap: false
      allow_unknown: true
      motion_model_for_search: "DUBIN"     # For Ackermann steering
      minimum_turning_radius: 3.0          # Wheelbase / tan(max_steer_angle)
      angle_quantization_bins: 72
      analytic_expansion_ratio: 0.0
      analytic_expansion_max_length: 0.0
      smooth_path: true


##############################
# 🪄 Smoother Server
#    - Post-processes planner path for curvature & smoothness
##############################
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True


##############################
# 📍 Waypoint Follower
#    - Optional waypoint behavior for multi-goal sequences
##############################
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200


##############################
# 🧤 Velocity Smoother
#    - Smooths acceleration and braking between cmd_vel updates
##############################
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0              # Hz
    scale_velocities: False
    feedback: "OPEN_LOOP"                  # Use time-based smoothing (no odom feedback)
    max_velocity: [2.0, 0.0, 0.5]          # [vx, vy, ω]
    min_velocity: [-2.0, 0.0, -0.5]
    max_accel: [0.5, 0.0, 0.3]             # Acceleration limits (m/s², rad/s²)
    max_decel: [-0.8, 0.0, -0.5]           # Deceleration limits
    odom_topic: /odometry/global
    odom_duration: 0.1
    deadband_velocity: [0.02, 0.0, 0.0]
    velocity_timeout: 0.05

################################################################################
# 🧭 NAVIGATION CONFIGURATION — AV.ONE DRIVERLESS (SIMPLE BT VERSION)
#
# Simplified setup for direct ComputePathToPose → FollowPath behavior.
# Behavior Server (Spin/Backup/etc.) removed.
#
# GPS WPF Changes:
# - AMCL removed (global localization from EKF/GPS)
# - Static layers removed (no global map)
# - Global costmap uses rolling window (for large GPS-driven navigation)
################################################################################
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names: 
      - 'controller_server'
      - 'smoother_server'
      - 'planner_server'
      - 'behavior_server'
      - 'bt_navigator'
      - 'waypoint_follower'
      - 'velocity_smoother'
      - 'collision_monitor'  # Add this line

##############################
# 🧠 Behavior Tree Navigator
##############################
bt_navigator:
  ros__parameters:
    use_sim_time: false                     # Use sim time (Gazebo or rosbag)
    default_nav_to_pose_bt_xml: $(find-pkg-share avone_nav)/behaviour_trees/avone_bt.xml
    global_frame: map                      # Frame of goals
    robot_base_frame: base_link            # Robot’s main reference frame
    # odom_topic: /ackermann_steering_controller/odometry

    odom_topic: /ackermann_steering_controller/odometry
    bt_loop_duration: 10                   # Tick rate of behavior tree (Hz^-1)

    # Single navigator plugin (no NavThroughPoses)
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"


##############################
# ⚙️ Controller Server
#    - Regulated Pure Pursuit Controller
#    - Responsible for real-time velocity & path following
##############################
controller_server:
  ros__parameters:
    controller_frequency: 20.0     # Hz control loop  
    min_vel_x: 1.0      
    # min_x_velocity_threshold: 0.001
    # min_y_velocity_threshold: 0.001
    # min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3                 # Allowable deviation before abort
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"   # <-- required!  
    controller_plugins: ["FollowPath"]

    # --- Progress Checker ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2        # Must move this far to count as progress
      movement_time_allowance: 10.0         # Time window for progress (s)

    # --- Goal Checker ---
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.8               # Distance tolerance (m)
      yaw_goal_tolerance: 1.0             # Orientation tolerance (rad)
      latch_xy_goal_tolerance: True        # Latch goal success once inside XY tol

    # --- Main Path Follower ---
    FollowPath:
          plugin: "nav2_mppi_controller::MPPIController"
          
          # REDUCE COMPUTATIONAL LOAD
          time_steps: 35             # Reduce from 40-50
          model_dt: 0.05             
          batch_size: 1000           # CRITICAL: Reduce from 2000
          
          iteration_count: 1         # Keep at 1
          
          vx_std: 0.8                
          vy_std: 0.0                
          wz_std: 0.1                
          
          vx_max: 3.0                
          vx_min: 0.0                
          vy_max: 0.0                
          wz_max: 0.2                
          
          ax_max: 0.4                
          ax_min: -0.4               
          ay_max: 0.0                
          ay_min: 0.0                
          az_max: 0.03               
          
          temperature: 0.2           
          gamma: 0.015               
          
          motion_model: "Ackermann"  
          visualize: false           # CRITICAL: Turn OFF - huge CPU hit
          
          reset_period: 1.0          
          regenerate_noises: false   
          open_loop: false           
          
          prune_distance: 20.0       
          transform_tolerance: 0.1   
          
          AckermannConstraints:
            min_turning_r: 4.5       
          
          TrajectoryValidator:
            plugin: "mppi::DefaultOptimalTrajectoryValidator"
            collision_lookahead_time: 3.0    # Reduce from 5.0
            consider_footprint: true         
          
          critics: [
            "ConstraintCritic",
            "CostCritic",
            "GoalCritic",
            "GoalAngleCritic",
            "PathFollowCritic",
            "PathAngleCritic",
            "PathAlignCritic",
            "PreferForwardCritic",
            "VelocityDeadbandCritic"
          ]
          # Remove PathAlignCritic temporarily - it's expensive
          
          ConstraintCritic:
            enabled: true
            cost_power: 1
            cost_weight: 10.0

          GoalCritic:
            enabled: true
            cost_power: 1
            cost_weight: 5.0

          GoalAngleCritic:
            enabled: true
            cost_power: 1
            cost_weight: 5.0

          PreferForwardCritic:
            enabled: true
            cost_power: 1
            cost_weight: 20.0

          CostCritic:
            enabled: true
            cost_power: 1
            cost_weight: 3.81
            critical_cost: 300.0
            consider_footprint: true
            collision_cost: 1000000.0
            near_goal_distance: 5.0
            trajectory_point_step: 3  # Increase from 2 (check fewer points)

          PathFollowCritic:
            enabled: true
            cost_power: 1
            cost_weight: 15.0
            offset_from_furthest: 8
            threshold_to_consider: 1.4

          PathAngleCritic:
            enabled: true
            cost_power: 1
            cost_weight: 15.0
            offset_from_furthest: 10
            threshold_to_consider: 0.3
            max_angle_to_furthest: 0.6
            mode: 0

          PathAlignCritic:
            enabled: true
            cost_power: 1
            cost_weight: 15.0                    # Moderate weight - not too aggressive
            trajectory_point_step: 5            # Check every 5th point (less CPU)
            offset_from_furthest: 20            # Look 15 points ahead on path
            threshold_to_consider: 0.2         # Only engage when >0.4m from path
            max_angle_to_furthest: 0.8        # 90 degrees in radians (π/2)
            use_path_orientations: false        # CRITICAL: False for straight line stability

          VelocityDeadbandCritic:
            enabled: true
            cost_power: 1
            cost_weight: 30.0
            deadband_velocities: [1.5, 0.0, 0.0]



velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 40.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    
    # --- Velocity Limits ---
    max_velocity: [3.0, 0.0, 0.2]
    min_velocity: [0.0, 0.0, -0.2]
    
    # --- Deadband Velocities ---
    # deadband_velocity: [0.0, 0.5, 0.0]   # Disabled for now - was killing your output
    
    # --- Acceleration Limits ---
    max_accel: [0.5, 0.0, 0.2]
    max_decel: [-1.0, 0.0, -0.2]
    
    # --- Timeout ---
    velocity_timeout: 1.0
    
    # --- Odometry Configuration ---
    odom_topic: /ackermann_steering_controller/odometry
    odom_duration: 0.1
    
    # --- Performance ---
    use_realtime_priority: false
    
    # --- Message Type ---
    enable_stamped_cmd_vel: false

# ##############################
# 🗺 Local Costmap
#    - Short-range obstacle avoidance region
##############################
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[
        [-0.17, -0.744],
        [ 2.445, -0.744],
        [ 2.445,  0.744],
        [-0.17,  0.744]
      ]"                            # Vehicle footprint (m)
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.05
      robot_radius: 1.5

      plugins: ["voxel_layer", "inflation_layer"]

      # --- 3D Voxel Obstacle Layer ---
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 16
        max_obstacle_height: 3.2
        mark_threshold: 1
        unknown_threshold: 2147483647
        combination_method: 1
        obstacle_max_range: 50.0
        raytrace_max_range: 50.0
        voxel_decay: 1.0           # 100% decay per cycle
        clearing: true
        inf_is_valid: true
        decay_model: 1             # Exponential decay
        observation_sources: pointcloud
        
        pointcloud:
          topic: /lidar/points
          # topic: /quanergy/points
          # topic: /nav2_points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 3.2
          obstacle_max_range: 50.0
          raytrace_max_range: 50.0
          observation_persistence: 0.0


      # --- Inflation Layer ---
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 3.0
        cost_scaling_factor: 8.0


##############################
# 🌏 Global Costmap
#    - Long-range global planner reference
#    - Rolling to follow GPS-based motion
##############################
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[
        [-0.17, -0.744],
        [ 2.445, -0.744],
        [ 2.445,  0.744],
        [-0.17,  0.744]
      ]"

      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 1.5
      resolution: 0.1
      rolling_window: true                 # Rolling costmap for large-scale GPS nav
      width: 150
      height: 150
      track_unknown_space: true

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 16
        max_obstacle_height: 3.2
        mark_threshold: 1
        unknown_threshold: 2147483647
        combination_method: 1
        obstacle_max_range: 50.0
        raytrace_max_range: 50.0
        observation_sources: pointcloud
        pointcloud:
          topic: /lidar/points
          # topic: /quanergy/points
          # topic: /nav2_points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 3.2
          obstacle_max_range: 50.0
          raytrace_max_range: 50.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 3.0
        cost_scaling_factor: 8.0


##############################
# 🧮 Planner Server
#    - Smac Hybrid Planner (Dubins)
#    - Generates Ackermann-feasible global paths
##############################
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 1.0
      downsample_costmap: false
      allow_unknown: true
      motion_model_for_search: "DUBIN"     # For Ackermann steering
      minimum_turning_radius: 4.5          # Wheelbase / tan(max_steer_angle)
      angle_quantization_bins: 72
      analytic_expansion_ratio: 0.0
      analytic_expansion_max_length: 0.0
      smooth_path: true
      goal_heading_mode: DEFAULT
      # cost_penalty: 10.0

      cost_penalty: 3.0              # start around 2.5–3.0
      change_penalty: 0.1            # penalty for switching left/right
      non_straight_penalty: 3.0     # slight preference for straight
      reverse_penalty: 2.0           # only matters if you use Reeds-Shepp
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      use_quadratic_cost_penalty: false   # see next section
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false



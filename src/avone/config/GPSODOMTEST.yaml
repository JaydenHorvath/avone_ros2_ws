ekf_localization_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true
    print_diagnostics: true

    # Using GPS heading as IMU orientation
    imu0: /heading
    imu0_config: [false, false, false,
                  true, true, true,
                  true, true, true,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false

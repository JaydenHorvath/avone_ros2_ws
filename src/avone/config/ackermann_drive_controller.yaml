controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


    ackermann_steering_controller:
      type: 'ackermann_steering_controller/AckermannSteeringController'




ackermann_steering_controller:
  ros__parameters:
    wheelbase: 1.74
    front_wheel_track: 1.245
    rear_wheel_track: 1.245
    front_wheels_radius: 0.203
    rear_wheels_radius: 0.203
    front_steering: true
    reference_timeout: 2.0
    rear_wheels_names: ['RRMotor','RLMotor']
    front_wheels_names: ['LSteer',  'RSteer']
    # false for joystick control
    use_stamped_vel: true

    open_loop: true
    velocity_rolling_window_size: 10
    base_frame_id: base_link
    odom_frame_id: odom

    # false for localalised sim
    enable_odom_tf: true
    
    twist_covariance_diagonal: [0.05, 0.05, 0.0, 0.0, 0.0, 0.5]
    pose_covariance_diagonal: [0.05, 0.05, 0.0, 0.0, 0.0, 0.5]
    position_feedback: true
    publish_rate: 100.0   # Hz, or whatever rate you want


